[window]
decorations = "None"
padding = { x = 12, y = 0 }
blur = false
opacity = 1

[font]
size = 13.4

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "SemiBold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>—"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
