# Hyprland config — translated from stow/niri/.config/niri/config.kdl
#
# Goal: same muscle memory as niri. Every bind below is either an exact
# equivalent of a niri bind or the closest Hyprland analogue. Binds that have
# no analogue are listed, commented out, in the "UNMAPPED" section at the end.
#
# This config uses Hyprland 0.56's NATIVE SCROLLING LAYOUT
# (general:layout = scrolling), which is the same model niri uses: an infinite
# horizontal tape of columns, each column stacking windows vertically. Column
# operations therefore go through `layoutmsg` rather than being emulated with
# dwindle splits and window groups, so the translation is close to literal.
#
# Mental model for the directional binds:
#   left/right  act on COLUMNS along the tape
#   up/down     act on WINDOWS inside the focused column
#
# Modifier mapping (niri `input { mod-key "Alt" }`):
#   niri "Mod"   -> ALT    ($mod)
#   niri "Super" -> SUPER  ($sup)

$mod = ALT
$sup = SUPER

$term        = alacritty
$browser     = chromium-browser
$scripts     = ~/dotfiles/scripts

################################################################################
# OUTPUTS                                        (niri: output "eDP-1")
################################################################################

# Physical layout: Xiaomi (DP-1) on the LEFT, laptop (eDP-1) on the RIGHT.
# Positions are in LOGICAL pixels (post-scale), so eDP-1 starts where DP-1's
# logical width ends: 3440 / 1.0 = 3440. eDP-1's own logical size is
# 1920/1.25 x 1200/1.25 = 1536x960.
# The EDID-preferred mode is only 3440x1440@50, so the rate is pinned
# explicitly to the panel's fastest advertised mode.
monitor = DP-1,  3440x1440@99.99,    0x0,    1

# mode 1920x1200@120.015, scale 1.25, variable-refresh-rate
monitor = eDP-1, 1920x1200@120.015,  3440x0, 1.25

# Any other output (projector, dock) still gets auto-placed to the right.
monitor = , preferred, auto, 1

################################################################################
# WORKSPACE BANDS                    (niri: per-monitor workspace strips)
################################################################################
# niri gives each monitor its own independent workspace strip; Hyprland has one
# global list whose entries migrate between monitors. To emulate niri, the
# global list is split into one fixed band per output, and the binds further
# down go through $scripts/hypr-ws.sh, which makes them monitor-relative.
# See the header of that script for the full reasoning.
#
# Keep these in sync with MONITOR_BASES in hypr-ws.sh.

# DP-1 (Xiaomi, left) -> slots 1..9
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1

# eDP-1 (laptop, right) -> slots 1..9 live at 11..19
workspace = 11, monitor:eDP-1, default:true
workspace = 12, monitor:eDP-1
workspace = 13, monitor:eDP-1
workspace = 14, monitor:eDP-1
workspace = 15, monitor:eDP-1
workspace = 16, monitor:eDP-1
workspace = 17, monitor:eDP-1
workspace = 18, monitor:eDP-1
workspace = 19, monitor:eDP-1

misc:vrr = 1

################################################################################
# INPUT                                          (niri: input { })
################################################################################

input {
    # niri: keyboard { numlock; repeat-delay 250; repeat-rate 20 }
    numlock_by_default = true
    repeat_delay       = 250
    repeat_rate        = 20

    follow_mouse       = 1

    # niri: mouse { accel-speed 0 }
    sensitivity        = 0

    touchpad {
        # niri: touchpad { tap; dwt; natural-scroll; accel-speed 0.1 }
        tap-to-click        = true
        disable_while_typing = true
        natural_scroll      = true
        # Hyprland has no per-device accel-speed in this block; 0.1 is close to
        # the default profile, so it is left at the global sensitivity above.
    }
}

# niri: gestures { hot-corners { off } } — Hyprland has no hot corners at all.

################################################################################
# LOOK & FEEL                                    (niri: layout { }, window-rule)
################################################################################

general {
    # Hyprland 0.56 ships a native scrolling layout — niri's exact model: an
    # infinite horizontal tape of COLUMNS, each column stacking windows
    # vertically. With this in place the binds below stop being dwindle-tree
    # approximations and become near-literal translations of the niri ones.
    layout = scrolling

    # niri: focus-column-left/right stop at the ends, they do not wrap. This
    # also governs Mod+Ctrl+H/L (swapcol), hence wrap_swapcol below.
    no_focus_fallback = true

    # niri: layout { gaps 7 }. niri puts `gaps` px between windows AND at the
    # screen edge; Hyprland doubles gaps_in between neighbours, hence 3.5.
    gaps_in  = 3.5
    gaps_out = 7

    # niri: focus-ring { on; width 2; active #7fc8ff; inactive #505050 }
    # (niri's `border` block is `off`, so only the focus ring is ported.)
    border_size        = 2
    col.active_border  = rgb(7fc8ff)
    col.inactive_border = rgb(505050)

    resize_on_border = true
}

decoration {
    # niri: catch-all window-rule { geometry-corner-radius 15 }
    rounding = 15

    # niri: catch-all window-rule { background-effect { blur true; saturation 0.9 } }
    blur {
        enabled = true
        size    = 6
        passes  = 2
        vibrancy = 0.1
        popups  = true
    }

    # niri: layout { shadow { softness 30; spread 5; offset x=0 y=5; color "#0007" } }
    # Hyprland has no `spread`; range absorbs it.
    shadow {
        enabled = true
        range   = 30
        offset  = 0 5
        color   = rgba(00000077)
        render_power = 3
    }
}

group {
    # Hyprland groups are the closest thing to a niri column with
    # `toggle-column-tabbed-display` on, so they get the niri focus-ring colours.
    col.border_active   = rgb(7fc8ff)
    col.border_inactive = rgb(505050)

    groupbar {
        enabled             = true
        disable_when_only   = true   # niri: tab-indicator { hide-when-single-tab }
        col.active          = rgb(7fc8ff)
        col.inactive        = rgb(505050)
    }
}

# The dwindle block is kept only so switching `general:layout` back for a quick
# comparison still behaves; it is inert while layout = scrolling.
dwindle {
    preserve_split = true
    smart_resizing = true
}

scrolling {
    # niri: layout { default-column-width { proportion 0.5; } }
    column_width = 0.5

    # niri: layout { preset-column-widths { proportion 0.33333 / 0.5 / 0.66667 } }
    # Cycled by `colresize +conf` / `-conf` (Mod+R). The Hyprland default also
    # tacks on 1.0; niri's list has only the three, so 1.0 is dropped to keep
    # Mod+R cycling through exactly what niri cycles through.
    explicit_column_widths = 0.33333, 0.5, 0.66667

    # niri: layout { center-focused-column "never" } — focusing an off-screen
    # column parks it at the screen edge instead of centring it.
    # 1 = fit (niri's "never"), 0 = always centre.
    focus_fit_method = 1

    # niri scrolls right and opens new columns to the right of the focused one.
    direction = right

    # niri brings a newly focused window into view automatically.
    follow_focus = true

    # niri stops at the first/last column rather than wrapping around.
    wrap_focus   = false
    wrap_swapcol = false

    # niri does NOT balloon a lone window to full width — with
    # default-column-width 0.5 a single window occupies half the screen and
    # sits at the left edge. Hyprland defaults this to true, so it must be
    # turned off to match.
    fullscreen_on_one_column = false
}

################################################################################
# ANIMATIONS                                     (niri: animations { })
################################################################################
# niri uses critically-damped springs; Hyprland uses beziers + durations.
# A spring with damping-ratio 1.0 and stiffness k settles in roughly 4/sqrt(k)
# seconds, so stiffness 950 ~= 130 ms and stiffness 1200 ~= 115 ms.
# niri `slowdown 0.95` is folded into the durations below.

bezier = easeOutExpo, 0.16, 1.00, 0.30, 1.00
bezier = easeOutQuad, 0.50, 1.00, 0.89, 1.00
bezier = springish,   0.05, 0.90, 0.10, 1.00

animations {
    enabled = true

    # durations are in 10 ms units
    animation = windowsIn,   1, 1.0,  easeOutExpo, popin 90%   # window-open  100 ms
    animation = windowsOut,  1, 1.0,  easeOutQuad, popin 90%   # window-close 100 ms
    animation = windowsMove, 1, 1.3,  springish                # window-movement k=950
    animation = layersIn,    1, 1.0,  easeOutExpo, fade
    animation = layersOut,   1, 1.0,  easeOutQuad, fade
    animation = fade,        1, 1.0,  easeOutQuad
    animation = border,      1, 1.0,  easeOutQuad
    animation = workspaces,  1, 1.2,  springish,   slide       # workspace-switch k=1200
    animation = specialWorkspace, 1, 1.2, springish, slidevert
}

################################################################################
# STARTUP                                        (niri: spawn-at-startup)
################################################################################

exec-once = noctalia
exec-once = $term
exec-once = wl-paste --watch cliphist store

# Put each workspace band back on its own monitor. Needed because
# `workspace = N, monitor:X` rules only apply at workspace CREATION, so a
# reload or a monitor replug can leave a band on the wrong output.
exec = bash $scripts/hypr-ws.sh reconcile

################################################################################
# WINDOW RULES                                   (niri: window-rule { })
################################################################################

# Hyprland 0.56 window-rule syntax: comma-separated `field value` pairs, with
# matchers namespaced under `match:`. The old `windowrule = float, class:^(x)$`
# form (and `windowrulev2`) is gone — boolean rules now need an explicit value.

# niri: match app-id ^(discord|vesktop|Vesktop)$ -> opacity 1.0, radius 16, blur
windowrule = opacity 1.0 1.0, rounding 16, match:class ^(discord|vesktop|Vesktop)$

# niri: block-out-from "screencast" for discord / google-chrome / vesktop
windowrule = no_screen_share true, match:class ^(discord|vesktop|google-chrome)$

# niri: match app-id ^scratchterm$ -> open-floating, focused, 50% x 50%
windowrule = float true, size 50% 50%, center true, match:class ^(scratchterm)$

# niri: match app-id firefox$ title "^Picture-in-Picture$" -> open-floating
windowrule = float true, pin true, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$

# niri: match is-window-cast-target=true -> red border. Hyprland has no
# equivalent match condition; see UNMAPPED.

################################################################################
# BINDS — APPLICATIONS                           (niri: binds, spawn/spawn-sh)
################################################################################
# `bindd` carries a description, which is Hyprland's equivalent of niri's
# hotkey-overlay-title; $scripts/hypr-hotkeys.sh renders them like niri's
# Mod+Shift+/ overlay.

bindd = $mod SHIFT, slash,  Show this hotkey list,              exec, bash $scripts/hypr-hotkeys.sh
bindd = $mod,       D,      Open a Terminal: Alacritty,         exec, bash $scripts/hypr-term-cwd.sh
bindd = $mod,       F4,     Session Menu,                       exec, noctalia msg panel-toggle session
bindd = $mod,       space,  Run an Application: fuzzel,         exec, fuzzel
bindd = $mod SHIFT, G,      Clipboard History,                  exec, sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'
bindd = $mod SHIFT, space,  Search Nix/Home packages,           exec, bash $scripts/fuzzel-home-search.sh
bindd = $mod,       Return, Run a command in a disposable terminal, exec, bash $scripts/fuzzel-run.sh
bindd = $mod SHIFT, T,      OCR Region,                         exec, normcap

bindd = $sup,       L,      Lock Screen,                        exec, noctalia msg session lock
bindd = $sup,       E,      File Explorer,                      exec, xdg-open ~
# edot is a bash function in ~/.bashrc, not a binary, so it needs an
# interactive bash (-i); -l/sh hits the non-interactive guard in ~/.bashrc.
bindd = $sup,       D,      Edit dotfiles,                      exec, bash -ic edot
bindd = $sup,       B,      Open Brave Browser,                 exec, $browser
bindd = $sup,       M,      Open Spotify,                       exec, spotify
bind  = $sup ALT,   S,                                          exec, sh -c 'pkill orca || exec orca'

################################################################################
# BINDS — HARDWARE KEYS
################################################################################
# niri `allow-when-locked=true` -> Hyprland `l` flag. niri binds repeat by
# default -> `e` flag on the ones where repeating is wanted.
# Deviation: mute/media keys are NOT set to repeat (a repeating toggle just
# flickers); niri would repeat them.

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioStop,         exec, playerctl stop
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindl  = , XF86AudioNext,         exec, playerctl next

bindel = , XF86MonBrightnessUp,   exec, brightnessctl --class=backlight set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 10%-

################################################################################
# BINDS — WINDOW / FOCUS                         (niri: focus-*, move-*)
################################################################################

bind = $mod, Q, killactive,                         # niri: close-window

# niri: focus-column-left/right, focus-window-down/up
# `layoutmsg focus l/r` steps between COLUMNS and `u/d` steps between windows
# INSIDE the focused column — exactly niri's split. Plain `movefocus` would use
# spatial geometry instead and does not respect the column structure.
bind = $mod, left,  layoutmsg, focus l
bind = $mod, down,  layoutmsg, focus d
bind = $mod, up,    layoutmsg, focus u
bind = $mod, right, layoutmsg, focus r
bind = $mod, H,     layoutmsg, focus l
bind = $mod, J,     layoutmsg, focus d
bind = $mod, K,     layoutmsg, focus u
bind = $mod, L,     layoutmsg, focus r

# niri: move-column-left/right (swap whole columns along the tape),
#       move-window-down/up (reorder within the column).
# Note the asymmetry: left/right move a COLUMN, up/down move a WINDOW. That is
# why the horizontal pair uses `swapcol` and the vertical pair `movewindow`.
bind = $mod CTRL, left,  layoutmsg, swapcol l
bind = $mod CTRL, right, layoutmsg, swapcol r
bind = $mod CTRL, H,     layoutmsg, swapcol l
bind = $mod CTRL, L,     layoutmsg, swapcol r
bind = $mod CTRL, down,  movewindow, d
bind = $mod CTRL, up,    movewindow, u
bind = $mod CTRL, J,     movewindow, d
bind = $mod CTRL, K,     movewindow, u

################################################################################
# BINDS — MONITORS                               (niri: focus-monitor-*)
################################################################################

bind = $mod SHIFT, left,  focusmonitor, l
bind = $mod SHIFT, down,  focusmonitor, d
bind = $mod SHIFT, up,    focusmonitor, u
bind = $mod SHIFT, right, focusmonitor, r
bind = $mod SHIFT, H,     focusmonitor, l
bind = $mod SHIFT, J,     focusmonitor, d
bind = $mod SHIFT, K,     focusmonitor, u
bind = $mod SHIFT, L,     focusmonitor, r

# niri: move-column-to-monitor-*
bind = $mod SHIFT CTRL, left,  movewindow, mon:l
bind = $mod SHIFT CTRL, down,  movewindow, mon:d
bind = $mod SHIFT CTRL, up,    movewindow, mon:u
bind = $mod SHIFT CTRL, right, movewindow, mon:r
bind = $mod SHIFT CTRL, H,     movewindow, mon:l
bind = $mod SHIFT CTRL, J,     movewindow, mon:d
bind = $mod SHIFT CTRL, K,     movewindow, mon:u
bind = $mod SHIFT CTRL, L,     movewindow, mon:r

################################################################################
# BINDS — WORKSPACES                             (niri: focus-workspace-*)
################################################################################
# Every workspace bind is monitor-relative via hypr-ws.sh: the number is a slot
# in the focused monitor's own band, not a global workspace id. So Alt+1 on the
# laptop and Alt+1 on the Xiaomi go to two different workspaces, and neither
# monitor's strip is ever dragged onto the other — the niri behaviour.
#
# Bare `workspace, e+1` is deliberately NOT used: it walks the global list and
# would spill from one monitor's band into the other's. The script clamps to
# the band instead.

bind = $mod, Page_Down, exec, bash $scripts/hypr-ws.sh next
bind = $mod, Page_Up,   exec, bash $scripts/hypr-ws.sh prev
bind = $mod, U,         exec, bash $scripts/hypr-ws.sh next
bind = $mod, I,         exec, bash $scripts/hypr-ws.sh prev

# niri: move-column-to-workspace-down/up
bind = $mod CTRL, Page_Down, exec, bash $scripts/hypr-ws.sh movenext
bind = $mod CTRL, Page_Up,   exec, bash $scripts/hypr-ws.sh moveprev
bind = $mod CTRL, U,         exec, bash $scripts/hypr-ws.sh movenext
bind = $mod CTRL, I,         exec, bash $scripts/hypr-ws.sh moveprev

# niri: focus-workspace 1..9 / move-column-to-workspace 1..9
bind = $mod, 1, exec, bash $scripts/hypr-ws.sh switch 1
bind = $mod, 2, exec, bash $scripts/hypr-ws.sh switch 2
bind = $mod, 3, exec, bash $scripts/hypr-ws.sh switch 3
bind = $mod, 4, exec, bash $scripts/hypr-ws.sh switch 4
bind = $mod, 5, exec, bash $scripts/hypr-ws.sh switch 5
bind = $mod, 6, exec, bash $scripts/hypr-ws.sh switch 6
bind = $mod, 7, exec, bash $scripts/hypr-ws.sh switch 7
bind = $mod, 8, exec, bash $scripts/hypr-ws.sh switch 8
bind = $mod, 9, exec, bash $scripts/hypr-ws.sh switch 9

bind = $mod CTRL, 1, exec, bash $scripts/hypr-ws.sh move 1
bind = $mod CTRL, 2, exec, bash $scripts/hypr-ws.sh move 2
bind = $mod CTRL, 3, exec, bash $scripts/hypr-ws.sh move 3
bind = $mod CTRL, 4, exec, bash $scripts/hypr-ws.sh move 4
bind = $mod CTRL, 5, exec, bash $scripts/hypr-ws.sh move 5
bind = $mod CTRL, 6, exec, bash $scripts/hypr-ws.sh move 6
bind = $mod CTRL, 7, exec, bash $scripts/hypr-ws.sh move 7
bind = $mod CTRL, 8, exec, bash $scripts/hypr-ws.sh move 8
bind = $mod CTRL, 9, exec, bash $scripts/hypr-ws.sh move 9

# Manual re-sync, for when a replugged monitor comes back without its band.
bindd = $mod SHIFT, M, Re-sync workspaces to monitors, exec, bash $scripts/hypr-ws.sh reconcile

# niri: Mod+WheelScroll{Down,Up} cooldown-ms=150 -> focus-workspace-down/up
# (Hyprland has no per-bind cooldown; see UNMAPPED.)
bind = $mod,      mouse_down, exec, bash $scripts/hypr-ws.sh next
bind = $mod,      mouse_up,   exec, bash $scripts/hypr-ws.sh prev
bind = $mod CTRL, mouse_down, exec, bash $scripts/hypr-ws.sh movenext
bind = $mod CTRL, mouse_up,   exec, bash $scripts/hypr-ws.sh moveprev

# niri: Mod+Shift+WheelScroll{Down,Up} -> focus-column-right/left
bind = $mod SHIFT, mouse_down, layoutmsg, focus r
bind = $mod SHIFT, mouse_up,   layoutmsg, focus l
bind = $mod CTRL SHIFT, mouse_down, layoutmsg, swapcol r
bind = $mod CTRL SHIFT, mouse_up,   layoutmsg, swapcol l

# niri: Mod+WheelScroll{Left,Right} -> focus-column-left/right
# Previously unmappable — 0.56 exposes horizontal wheel ticks as
# mouse_left / mouse_right.
bind = $mod,      mouse_right, layoutmsg, focus r
bind = $mod,      mouse_left,  layoutmsg, focus l
bind = $mod CTRL, mouse_right, layoutmsg, swapcol r
bind = $mod CTRL, mouse_left,  layoutmsg, swapcol l

# Mouse drag/resize (not in the niri config, but Hyprland has no default)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

################################################################################
# BINDS — COLUMNS / GROUPS                       (niri: consume/expel, tabbed)
################################################################################
# Under the scrolling layout a COLUMN is a first-class object, so these are no
# longer faked with Hyprland groups — they are the real niri operations.
# A Hyprland group is still used for the tabbed display, which is orthogonal to
# the column structure (the scrolling layout steps into groups).

bind = $mod, bracketleft,  layoutmsg, consume_or_expel prev  # niri: consume-or-expel-window-left
bind = $mod, bracketright, layoutmsg, consume_or_expel next  # niri: consume-or-expel-window-right
bind = $mod, comma,        layoutmsg, consume                # niri: consume-window-into-column
bind = $mod, period,       layoutmsg, expel                  # niri: expel-window-from-column
bind = $mod, T,            togglegroup                       # niri: toggle-column-tabbed-display

################################################################################
# BINDS — SIZING                                 (niri: set-column-width, etc.)
################################################################################

# niri: switch-preset-column-width — now native, cycling the
# `explicit_column_widths` list above. hypr-cycle-size.sh is no longer used for
# width (the layout tracks column widths itself); it still handles heights,
# which the scrolling layout has no preset mechanism for.
bind = $mod,       R, layoutmsg, colresize +conf
# niri: switch-preset-window-height
bind = $mod SHIFT, R, exec, bash $scripts/hypr-cycle-size.sh height
# niri: reset-window-height
bind = $mod CTRL,  R, exec, bash $scripts/hypr-cycle-size.sh reset

# niri: maximize-column — widen the focused column to the full view. `fit
# active` sets the column width to 1.0, which is what niri's maximize does;
# plain `fullscreen 1` would instead hide the rest of the tape.
bind = $mod,       F, layoutmsg, fit active
bind = $mod SHIFT, F, fullscreen, 0        # niri: fullscreen-window
# niri: expand-column-to-available-width
bind = $mod CTRL,  F, layoutmsg, fit expand

# niri: center-column
bind = $mod,      C, layoutmsg, center
# niri: center-visible-columns (closest analogue: size every on-screen column
# so the visible run fits the view exactly)
bind = $mod CTRL, C, layoutmsg, fit visible

# niri: set-column-width -10% / +10% (column widths are fractions of the view,
# so 10% is 0.1 here)
binde = $mod, minus, layoutmsg, colresize -0.1
binde = $mod, equal, layoutmsg, colresize +0.1
# niri: set-window-height -10% / +10% (still a plain resize within the column)
binde = $mod SHIFT, minus, resizeactive, 0 -10%
binde = $mod SHIFT, equal, resizeactive, 0  10%

################################################################################
# BINDS — FLOATING                               (niri: toggle-window-floating)
################################################################################

bind = $mod,       V, togglefloating
bind = $mod SHIFT, V, cyclenext, floating   # niri: switch-focus-between-floating-and-tiling

################################################################################
# BINDS — SCREENSHOTS                            (niri: screenshot*)
################################################################################
# niri's built-in screenshot UI has no Hyprland equivalent; Noctalia's is the
# closest match in feel and is already a dependency. Both save to
# ~/Pictures/Screenshots (niri: screenshot-path) and copy to the clipboard.

bindd = $sup SHIFT, S, Screenshot region, exec, noctalia msg screenshot-region
bindd = $sup SHIFT, A, Screenshot screen, exec, noctalia msg screenshot-fullscreen
bindd = ALT, Print,    Screenshot window, exec, bash $scripts/hypr-screenshot-window.sh

################################################################################
# BINDS — SESSION
################################################################################

bind = $mod SHIFT, E, exec, noctalia msg panel-toggle session   # niri: quit (w/ confirmation)
bind = CTRL ALT,   Delete, exec, noctalia msg panel-toggle session
bind = $mod SHIFT, P, dpms, off                                 # niri: power-off-monitors

################################################################################
# UNMAPPED — niri binds with no Hyprland equivalent
################################################################################
# Adopting the native scrolling layout closed three entries that used to live
# here: expand-column-to-available-width (`fit expand`), center-visible-columns
# (`fit visible`), and the horizontal wheel binds (mouse_left/mouse_right).
# What is left:
#
# Mod+O            toggle-overview               no native overview. hyprexpo
#                                                plugin would cover it.
# Mod+Home/End     focus-column-first/last       the scrolling layout has real
# Mod+Ctrl+Home/End  move-column-to-first/last   columns but exposes no
#                                                jump-to-first/last command.
#                                                `fit tobeg` / `fit toend` are
#                                                NOT equivalents — they resize
#                                                every column to fit the view
#                                                rather than moving focus.
# Mod+Shift+PgUp/PgDn, Mod+Shift+U/I
#                  move-workspace-up/down        Hyprland workspaces are not
#                                                reorderable.
# Mod+Shift+W/X    set-dynamic-cast-window / clear-dynamic-cast-target
#                                                niri-specific screencast API.
# cooldown-ms=150 on wheel binds                 no per-bind cooldown.
# window-rule match is-window-cast-target=true   no equivalent match condition.
# prefer-no-csd                                  Hyprland always prefers SSD.

################################################################################
# SUBMAP — shortcut inhibit escape hatch         (niri: Mod+Escape)
################################################################################
# Must stay last: everything between `submap = passthrough` and `submap = reset`
# belongs to that submap.

bind = $mod, Escape, submap, passthrough
submap = passthrough
bind = $mod, Escape, submap, reset
submap = reset
