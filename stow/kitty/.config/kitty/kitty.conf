# Mirror the existing Alacritty terminal defaults as closely as Kitty supports.

# Window appearance
# hide_window_decorations yes
window_padding_width 0 12
background_opacity 0.6

# Typography
font_size 13.4
font_family JetBrainsMono Nerd Font SemiBold
bold_font auto
italic_font auto
bold_italic_font auto

# Match Ctrl+Backspace -> Ctrl+W from the Alacritty config.
map ctrl+backspace send_key ctrl+w

# Skip confirmation prompt when closing a window with running processes.
confirm_os_window_close 0

cursor_trail 50


# custom_shaders bloom
# custom_shaders crt-blue
# custom_shaders crt
# custom_shaders cursor-trail-blaze
# custom_shaders cursor-trail-lightning
# custom_shaders dim-inactive-windows
# custom_shaders fireworks-rockets
# custom_shaders fireworks
# custom_shaders focus-highlight
# custom_shaders inside-the-matrix
# custom_shaders negative
# custom_shaders northern-lights
# custom_shaders pond-ripple
# custom_shaders spot-light
# custom_shaders tab-change
# custom_shaders tft
# custom_shaders underwater
# custom_shaders water

include current-theme.conf
# END_KITTY_THEME
