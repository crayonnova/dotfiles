[backdrop]
blur_intensity = 0.0
enabled = true
tint_intensity = 0.0

[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.0
    capsule = false
    center = [ "taskbar" ]
    end = [ "notifications", "warp", "tray", "group:g3", "group:g1", "group:g4", "group:g2" ]
    margin_edge = 0
    margin_ends = 0
    position = "bottom"
    radius = 0
    widget_spacing = 7

        [[bar.main.capsule_group]]
        accordion = false
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "network", "bluetooth" ]
        opacity = 0.89999997615814209
        padding = 8.0
        radius = 23.0
        widget_spacing = 9

        [[bar.main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "battery" ]
        opacity = 0.89999997615814209
        padding = 11.0
        widget_spacing = 9

        [[bar.main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "volume", "brightness" ]
        opacity = 0.89999997615814209
        padding = 6.0

        [[bar.main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "clock", "date" ]
        opacity = 0.89999997615814209
        padding = 8.0

        [[bar.main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface"
        id = "g5"
        members = [ "sysmon", "temp", "ram" ]
        opacity = 0.88999998569488525
        padding = 8.0

[desktop_widgets]
enabled = false

[dock]
icon_size = 27
magnification_scale = 1.2500000037252903
main_axis_padding = 3
position = "top"
show_dots = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1564.0001220703125
    cy = 1190.0
    output = "DP-1"
    placement_height = 1309.0
    placement_width = 3127.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 768.0
    cy = 841.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 4900

[osd.kinds]
nightlight = false

[plugins]
auto_update = "official"
enabled = [ "levi/warp", "weinguyen/opencode-companion" ]

[shell]
external_ip_enabled = true
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.animation]
    enabled = false
    speed = 0.10000000149011612

    [shell.panel]
    floating_layer = "top"
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_position = "center"
    wallpaper_placement = "centered"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/nova/Pictures/Wallpapers/wallhaven_3zmr6y.jpg"

[wallpaper.last]
path = "/home/nova/Pictures/Wallpapers/wallhaven_3zmr6y.jpg"

[wallpaper.monitors.DP-1]
path = "/home/nova/Pictures/Wallpapers/wallhaven_3zmr6y.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/nova/Pictures/Wallpapers/wallhaven_3zmr6y.jpg"

[widget.battery]
font_family = "Cascadia Code"

[widget.bluetooth]
show_label = true

[widget.brightness]
font_family = "Cascadia Code"

[widget.clock]
color = "primary"
font_family = "Cascadia Code"
format = "{:%I:%M %p},"

[widget.date]
color = "primary"
icon_color = "primary"

[widget.media]
hide_when_no_media = true

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
font_family = "Cascadia Code"

[widget.sysmon]
font_family = "Cascadia Code"
label_show_units = false

[widget.taskbar]
active_indicator_color = "surface_variant"
capsule_padding = 0
capsule_radius = "auto"
focused_output_only = true
group_by_workspace = true
hide_empty_workspaces = true
icon_scale = 2.0
inactive_opacity = 1.0

[widget.temp]
font_family = "Cascadia Code"
show_glyph = false

[widget.tray]
capsule = true
scale = 1.1500000000000001

[widget.volume]
font_family = "Cascadia Code"

[widget.warp]
capsule = true
capsule_opacity = 0.44
enable_scroll = false
scale = 1.3
type = "levi/warp:warp"

[widget.workspaces]
anchor = true
enabled = false
labels_only_when_occupied = true
max_label_chars = 19
scale = 1.3500000000000001
style = "focus_hint"
